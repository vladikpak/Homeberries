databaseChangeLog:
  - changeSet:
      id: 007-create-order-items-table
      author: student
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column: {
                name: id,
                type: BIGINT,
                autoIncrement: true,
                constraints:
                  { primaryKey: true }
              }
              - column: {
                name: order_id,
                type: BIGINT,
                constraints:
                  { nullable: false }
              }
              - column: {
                name: product_id,
                type: BIGINT,
                constraints:
                  { nullable: false }
              }
              - column: {
                name: quantity,
                type: INT,
                constraints:
                  { nullable: false }
              }
              - column: {
                name: price,
                type: INT,
                constraints:
                  { nullable: false }
              }
        - addForeignKeyConstraint:
            constraintName: fk_order_item_order
            baseTableName: order_items
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_order_item_product
            baseTableName: order_items
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id