databaseChangeLog:
  - changeSet:
      id: 005-create-cart-items-table
      author: student
      changes:
        - createTable:
            tableName: cart_items
            columns:
              - column: {
                name: id,
                type: BIGINT,
                autoIncrement: true,
                constraints:
                  { primaryKey: true }
              }
              - column: {
                name: cart_id,
                type: BIGINT,
                constraints:
                  { nullable: false }
              }
              - column: {
                name: product_id,
                type: BIGINT,
                constraints:
                  { nullable: false }
              }
              - column: {
                name: quantity,
                type: INT,
                constraints:
                  { nullable: false }
              }
        - addForeignKeyConstraint:
            constraintName: fk_cart_item_cart
            baseTableName: cart_items
            baseColumnNames: cart_id
            referencedTableName: carts
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_cart_item_product
            baseTableName: cart_items
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id